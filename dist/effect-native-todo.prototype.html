<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Effect + XState Todo Logic Prototype</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #18201d;
        --muted: #66706b;
        --line: #d8dedb;
        --paper: #f4f6f3;
        --card: #ffffff;
        --accent: #13795b;
        --accent-soft: #dcf5eb;
        --danger: #a33a2b;
        --danger-soft: #fff0ed;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }
      body { margin: 0; color: var(--ink); background: var(--paper); line-height: 1.5; }
      button, input { font: inherit; }
      button { border: 0; cursor: pointer; }
      button:disabled { cursor: wait; opacity: .52; }

      .hero, main, footer { width: min(1120px, calc(100% - 40px)); margin-inline: auto; }
      .hero { padding: 72px 0 38px; border-bottom: 1px solid var(--line); }
      .eyebrow { color: var(--accent); font-size: .72rem; font-weight: 800; letter-spacing: .14em; }
      h1 { max-width: 820px; margin: 12px 0 18px; font-size: clamp(2.3rem, 5vw, 4.8rem); letter-spacing: -.055em; line-height: .98; }
      h2 { margin: 5px 0 0; font-size: clamp(1.65rem, 3vw, 2.4rem); letter-spacing: -.035em; }
      h3 { margin: 0 0 8px; font-size: 1.35rem; }
      p { margin: 0; }
      .question { max-width: 880px; font-size: 1.12rem; }
      .thesis { margin-top: 10px; color: var(--muted); }

      main > section { padding: 48px 0; border-bottom: 1px solid var(--line); }
      .section-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
      .section-heading.compact { align-items: center; }
      .status { border-radius: 999px; padding: 7px 12px; font-size: .82rem; font-weight: 800; }
      .status-idle { color: var(--accent); background: var(--accent-soft); }
      .status-running { color: #755500; background: #fff2bd; }
      .status-failed { color: var(--danger); background: var(--danger-soft); }

      .state-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
      .metric { min-height: 138px; padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
      .metric > span, .metric small { display: block; color: var(--muted); }
      .metric > span { margin-bottom: 16px; font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
      .metric strong { display: block; font-size: 2rem; line-height: 1.1; }
      .metric .metric-copy { font-size: 1rem; }
      .metric small { margin-top: 8px; font-size: .78rem; }
      .metric-error { border-color: #efb5aa; background: var(--danger-soft); }

      .machine-graph { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: center; gap: 12px; margin: 18px 0; }
      .dependency-flow { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: center; gap: 12px; margin: 18px 0; }
      .dependency-flow > div { padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
      .dependency-flow > div.selected { border-color: var(--accent); background: var(--accent-soft); }
      .dependency-flow b, .dependency-flow span { display: block; }
      .dependency-flow > span { color: var(--muted); font-weight: 800; text-align: center; }
      .dependency-flow div span { color: var(--muted); font-size: .78rem; }
      .graph-node { padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
      .graph-node b, .graph-node span { display: block; }
      .graph-node span { color: var(--muted); font-size: .78rem; }
      .graph-node.active { outline: 3px solid var(--accent); background: var(--accent-soft); }
      .graph-node.active.error { outline-color: var(--danger); background: var(--danger-soft); }
      .operation-stack { display: grid; gap: 8px; }
      .graph-arrow { color: var(--muted); text-align: center; font-size: .74rem; }
      .graph-arrow span { display: block; }
      .graph-arrow.split { display: flex; flex-direction: column; gap: 12px; }
      .raw-state { border: 1px solid var(--line); border-radius: 12px; background: #202724; color: #dce7e1; }
      .raw-state summary { padding: 13px 16px; cursor: pointer; font-weight: 700; }
      .raw-state pre { max-height: 420px; overflow: auto; margin: 0; padding: 0 16px 16px; font-size: .76rem; }

      .button-row { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
      button { padding: 10px 14px; border-radius: 9px; color: white; background: var(--accent); font-weight: 750; }
      button.secondary { color: var(--ink); background: white; border: 1px solid var(--line); }
      button.selected-control { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
      button.ghost { color: var(--danger); background: transparent; }
      .add-form { padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
      .add-form label { display: block; margin-bottom: 8px; font-size: .78rem; font-weight: 800; }
      .add-form > div { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
      input { width: 100%; min-width: 0; padding: 11px 13px; border: 1px solid var(--line); border-radius: 9px; color: var(--ink); background: #fafbf9; }
      input:focus { outline: 3px solid #bce7d8; border-color: var(--accent); }
      .todo-list { display: grid; gap: 8px; margin-top: 12px; }
      .todo { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
      .todo.completed strong { color: var(--muted); text-decoration: line-through; }
      .todo small { display: block; color: var(--muted); }
      .check { width: 28px; height: 28px; padding: 0; border: 2px solid var(--accent); border-radius: 7px; color: var(--accent); background: white; }
      .completed .check { color: white; background: var(--accent); }
      .delete { color: var(--danger); background: transparent; }
      .empty { padding: 22px; color: var(--muted); text-align: center; border: 1px dashed var(--line); border-radius: 12px; }
      .hint { margin-top: 12px; color: var(--muted); font-size: .82rem; }

      .tabs { display: flex; gap: 6px; margin-top: 22px; overflow-x: auto; }
      .tab { flex: 0 0 auto; color: var(--muted); background: transparent; border: 1px solid transparent; }
      .tab.selected { color: var(--accent); background: white; border-color: var(--line); }
      .scenario { display: grid; grid-template-columns: .78fr 1.22fr; gap: 32px; margin-top: 12px; padding: 26px; border: 1px solid var(--line); border-radius: 15px; background: var(--card); }
      .scenario-copy > p { color: var(--muted); }
      .scenario-copy .watch { margin-top: 18px; color: var(--ink); }
      .steps { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
      .step { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; opacity: .56; }
      .step.current, .step.done { opacity: 1; }
      .step.current { border-color: var(--accent); }
      .step.done { background: #f7faf8; }
      .step-number { display: grid; width: 28px; height: 28px; place-items: center; border-radius: 999px; color: var(--muted); background: var(--paper); font-size: .78rem; font-weight: 800; }
      .step.done .step-number { color: white; background: var(--accent); }
      .step small { display: block; color: var(--muted); }
      .complete-callout { grid-column: 2; padding: 14px; border-radius: 10px; color: var(--accent); background: var(--accent-soft); font-weight: 750; }

      .history { display: grid; gap: 6px; margin-top: 20px; }
      .history > div { display: grid; grid-template-columns: 46px 130px 130px 1fr; align-items: baseline; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: .82rem; }
      .history span { color: var(--muted); }
      .history code { color: var(--accent); font-weight: 750; }
      .history p { color: var(--muted); }
      footer { display: flex; justify-content: space-between; gap: 24px; padding: 26px 0 48px; color: var(--muted); font-size: .78rem; }

      @media (max-width: 820px) {
        .state-grid { grid-template-columns: repeat(2, 1fr); }
        .scenario { grid-template-columns: 1fr; }
        .complete-callout { grid-column: 1; }
        .machine-graph, .dependency-flow { grid-template-columns: 1fr; }
        .graph-arrow { transform: rotate(90deg); }
        .section-heading, footer { align-items: flex-start; flex-direction: column; }
        .button-row { justify-content: flex-start; }
        .history > div { grid-template-columns: 38px 1fr; }
        .history code, .history p { grid-column: 2; }
      }

      @media (max-width: 520px) {
        .hero, main, footer { width: min(100% - 24px, 1120px); }
        .hero { padding-top: 44px; }
        .state-grid { grid-template-columns: 1fr; }
        .add-form > div { grid-template-columns: 1fr; }
        .step { grid-template-columns: auto 1fr; }
        .step button { grid-column: 2; justify-self: start; }
      }
    </style>
  </head>
